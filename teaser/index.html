<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
"use strict";
/* ─────────────────────────────────────────────────────────────────────────────
   TEASER 15s · 1920×1080 · 60fps — "Sense" (Lương Thế Vinh)
   Mọi thứ là hàm THUẦN của thời gian t (giây) → render lại bất kỳ khung nào giống hệt nhau.
   Nhịp: 128 BPM ⇒ 1 beat = 0.46875s ⇒ 15s = đúng 32 beat. audio/audio.py dùng cùng lưới này.
   ───────────────────────────────────────────────────────────────────────────── */
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const BPM = 128, BEAT = 60 / BPM;
const b = n => n * BEAT;

const C = {
  ink: "#070d0a", ground: "#0b1510", green: "#132119", soft: "#23382c", line: "#4b5d4d",
  text: "#f2f5ec", sec: "#c2cdbb", lime: "#d4f236", blue: "#42b0d5", dim: "#3a3a33", hot: "#f6ffb8",
};

/* ── mốc thời gian chính (giây) ── */
const T = {
  sense: b(12), data: b(13),
  step: [b(16), b(18), b(20), b(22)], img2: b(22.5), img3: b(23),
  num: b(24), numLock: b(25.25),
  make: b(25.5), things: b(26), work: b(26.5),
  cut: b(27), spark: b(27.55), hit: b(28),
};

/* ── tiện ích ── */
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, t) => a + (c - a) * t;
const eOut3 = t => 1 - Math.pow(1 - clamp(t), 3);
const eOut5 = t => 1 - Math.pow(1 - clamp(t), 5);
const eInOut3 = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eInOutExpo = t => { t = clamp(t); return t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2; };
const eOutBack = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
const H2 = (a, c) => hash(Math.imul(a | 0, 73856093) ^ Math.imul(c | 0, 19349663) ^ 0x9e3779b9);
const q = (v, s) => Math.round(v / s) * s;

/* ── canvas ── */
const cv = document.getElementById("cv"); const ctx = cv.getContext("2d", { alpha: false });
const mk = (w = W, h = H) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const scn = mk(), sx = scn.getContext("2d", { alpha: false });     // cảnh thô
const acc = mk(), ax = acc.getContext("2d", { alpha: false });     // tích luỹ motion-blur
const mips = [1, 2, 4, 8, 16].map(d => mk(Math.ceil(W / d), Math.ceil(H / d)));
const bloomC = mk(480, 270), bloomX = bloomC.getContext("2d");
const tmpC = mk(), tmpX = tmpC.getContext("2d");
const txtC = mk(), txtX = txtC.getContext("2d");

/* ── ảnh app thật (screenshot đã có trong portfolio) ── */
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; }); }

/* ─────────────── Pixel-resolve: khung mới vào bằng khối to rồi nét dần ─────────────── */
const P_BIG = [96, 72, 56, 44, 34, 26, 20, 15, 11, 8, 5, 3, 2, 1];
const P_SMALL = [40, 30, 24, 18, 14, 10, 7, 5, 3, 2, 1];
const P_SNAP = [24, 12, 6, 3, 1];   // cắt 1/8 nốt: nét lại sau 5 khung để kịp nhìn ảnh
/* [thời điểm, rung(px), flash α, màu flash, bảng pixel, ca(px)] */
const HITS = [
  [T.sense, 14, .16, C.hot, null, 0], [T.data, 8, .10, C.hot, null, 0],
  [T.step[0], 22, .38, C.hot, P_BIG, 4], [b(17), 6, .10, C.lime, null, 0],
  [T.step[1], 18, .25, C.ink, P_BIG, 3], [b(19), 6, .10, C.ink, null, 0],
  [T.step[2], 18, .25, C.hot, P_BIG, 3], [b(21), 8, .10, C.lime, null, 0],
  [T.step[3], 18, .22, C.hot, P_BIG, 3], [T.img2, 14, .16, C.hot, P_SNAP, 2], [T.img3, 14, .16, C.hot, P_SNAP, 2],
  [T.num, 20, .30, C.hot, P_BIG, 4], [T.numLock, 10, .30, C.lime, null, 2],
  [T.make, 22, .30, C.ink, P_SNAP, 3], [T.things, 24, .30, C.ink, P_SNAP, 3], [T.work, 30, .45, C.ink, P_SMALL, 4],
  [T.hit, 46, 1.0, C.lime, P_BIG, 8],
];
function hitState(t) {
  let pix = 1, shake = 0, flash = 0, fcol = "#fff", ca = 0;
  for (const [ht, amp, fl, col, tab, cab] of HITS) {
    const u = t - ht; if (u < 0) continue;
    if (tab && u < tab.length / FPS) pix = tab[Math.min(tab.length - 1, Math.floor(u * FPS + 1e-6))];
    if (u < .30) shake = Math.max(shake, amp * Math.exp(-u * 16));
    const fd = ht === T.hit ? .12 : .09;
    if (u < fd) { const a = fl * (1 - u / fd); if (a > flash) { flash = a; fcol = col; } }
    if (u < .12) ca = Math.max(ca, cab * (1 - u / .12));
  }
  return { pix, shake, flash, fcol, ca };
}
/* khung có chuyển động nhanh → cộng dồn nhiều mẫu con cho motion-blur */
function isHot(t) { for (const h of HITS) { const u = t - h[0]; if (u >= -1e-4 && u < .22 && h[1] >= 14) return true; } return false; }

/* ─────────────── Thành phần dùng chung ─────────────── */
function cam(c, s = 1, rot = 0, ox = 0, oy = 0) { c.translate(W / 2 + ox, H / 2 + oy); c.rotate(rot); c.scale(s, s); c.translate(-W / 2, -H / 2); }
function fill(c, col) { c.fillStyle = col; c.fillRect(-200, -200, W + 400, H + 400); }
function dotField(c, a, col = C.text, size = 4, pitch = 40, off = 0) {
  c.fillStyle = col; c.globalAlpha = a;
  for (let x = pitch / 2 + off; x < W + 40; x += pitch) for (let y = pitch / 2; y < H + 40; y += pitch) c.fillRect(x - size / 2, y - size / 2, size, size);
  c.globalAlpha = 1;
}
function glow(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
  const p = c.globalCompositeOperation; c.globalCompositeOperation = "lighter"; c.globalAlpha = a; c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.globalAlpha = 1; c.globalCompositeOperation = p;
}
function ringSq(c, cx, cy, r, w, col, a) { // vòng vuông lan ra (Chebyshev) — hợp với lưới pixel
  if (a <= 0) return; c.strokeStyle = col; c.globalAlpha = a; c.lineWidth = w; c.strokeRect(cx - r, cy - r, r * 2, r * 2); c.globalAlpha = 1;
}
function font(weight, size, fam) { return `${weight} ${size}px "${fam}"`; }
function text(c, s, x, y, f, col, align = "left", ls = 0) {
  c.font = f; c.fillStyle = col; c.textAlign = align; c.textBaseline = "alphabetic"; c.letterSpacing = ls + "px"; c.fillText(s, x, y); c.letterSpacing = "0px";
}
function measure(c, s, f, ls = 0) { c.font = f; c.letterSpacing = ls + "px"; const w = c.measureText(s).width; c.letterSpacing = "0px"; return w; }

/* logo 3×3 của portfolio (BrandMark): IDLE = [2,4,6], bốn thế đường chéo "ma trận được sắp lại" */
const PERMS = [[0, 4, 8], [1, 4, 7], [2, 4, 6], [3, 4, 5]];
function drawMark(c, x, y, cell, gap, lit, alpha = 1, litCol = C.lime, dimCol = C.dim, dimA = 1) {
  for (let i = 0; i < 9; i++) {
    const on = lit.includes(i);
    c.globalAlpha = alpha * (on ? 1 : dimA); c.fillStyle = on ? litCol : dimCol;
    c.fillRect(x + (i % 3) * (cell + gap), y + Math.floor(i / 3) * (cell + gap), cell, cell);
  }
  c.globalAlpha = 1;
}

/* tiêu đề bước: wipe từng khối 40px từ trái sang */
function stepChrome(c, t0, t, idx, title, col, accent) {
  const u = t - t0;
  // 4 ô tiến độ + số bước
  for (let i = 0; i < 4; i++) {
    const on = i <= idx; const px = 100 + i * 52, py = 78;
    if (on) { c.fillStyle = accent; c.fillRect(px, py, 40, 40); } else { c.strokeStyle = col; c.globalAlpha = .4; c.lineWidth = 2; c.strokeRect(px + 1, py + 1, 38, 38); c.globalAlpha = 1; }
  }
  text(c, "0" + (idx + 1), 100 + 4 * 52 + 24, 108, font(600, 34, "IBM Plex Mono"), col, "left", 2);
  // tiêu đề
  let fsz = 132; const w0 = measure(c, title, font(700, fsz, "Space Grotesk"), -3); if (w0 > 1700) fsz = Math.floor(fsz * 1700 / w0);
  const f = font(700, fsz, "Space Grotesk"); const w = measure(c, title, f, -3);
  const e = eOut5(u / .22); const reveal = Math.min(w + 40, Math.ceil(e * (w + 40) / 40) * 40);
  c.save(); c.beginPath(); c.rect(80, 820, reveal, 240); c.clip();
  text(c, title, 100 + (1 - e) * -50, 985, f, col, "left", -3); c.restore();
}

/* ─────────────── Cảnh 1: Mở đầu + xây (0 → b16): ma trận, nhiễu, MAKE SENSE OF DATA. ─────────────── */
const MAT = { x0: 1200, y0: 440, pitch: 80, size: 40 };
const MATRIX_SEQ = [[1, [6]], [2.5, [6, 4]], [3.5, [6, 4, 2]], [5, [7, 4, 1]], [6, [8, 4, 0]], [7, [5, 4, 3]], [8, [6, 4, 2]]];
function matrixLit(beat) {
  if (beat >= 8) return PERMS[Math.floor(beat - 8 + 2) % 4];      // từ b8 đổi thế mỗi beat như hover của logo
  let cur = [], from = [];
  for (const [bb, s] of MATRIX_SEQ) if (beat >= bb) { from = cur; cur = s; }
  return cur;
}
const MAT_EVENTS = (() => { const ev = []; let prev = []; for (const [bb, s] of MATRIX_SEQ) { for (const i of s) if (!prev.includes(i)) ev.push([b(bb), i]); prev = s; } for (let k = 9; k <= 10; k++) ev.push([b(k), PERMS[(k - 8 + 2) % 4][0]]); return ev; })();

let GL = null; // dữ liệu hạt của chữ
function buildGlyphs() {
  const size = 214, f = font(400, size, "Archivo Black");
  const c = txtX; c.clearRect(0, 0, W, H);
  const l1a = "MAKE ", l1b = "SENSE", l2 = "OF DATA.";
  const wa = measure(c, l1a, f), wb = measure(c, l1b, f), w2 = measure(c, l2, f);
  const x1 = (W - (wa + wb)) / 2, x2 = (W - w2) / 2, y1 = 490, y2 = 490 + 236;
  const cells = [];
  const sample = (s, x, y, col, line) => {
    c.clearRect(0, 0, W, H); c.font = f; c.fillStyle = "#fff"; c.textBaseline = "alphabetic"; c.fillText(s, x, y);
    const d = c.getImageData(0, 0, W, H).data;
    for (let py = 0; py < H; py += 10) for (let px = 0; px < W; px += 10) if (d[((py + 5) * W + (px + 5)) * 4 + 3] > 140) cells.push({ tx: px, ty: py, col, line });
  };
  sample(l1a, x1, y1, C.text, 1); sample(l1b, x1 + wa, y1, C.lime, 1); sample(l2, x2, y2, C.text, 2);
  c.clearRect(0, 0, W, H);
  const N = cells.length;
  cells.forEach((p, i) => {
    const r1 = H2(i, 1), r2 = H2(i, 2), r3 = H2(i, 3);
    const arrive = p.line === 1 ? T.sense : T.data;
    p.dur = .34 + .26 * r2; p.launch = arrive - p.dur - .34 * r1; p.arrive = arrive;
    p.ap = Math.min(2.2 + 3.4 * Math.sqrt(r3), p.launch - .08);
    p.curve = (r1 - .5) * 260; p.rate = .35 + 1.3 * r2; p.big = H2(i, 9) < .07;
  });
  GL = { cells, N, cx: W / 2, cy: (y1 + y2) / 2 - 90 };
}
const wanderPos = (i, t, rate) => { const slot = Math.floor(t * rate + i * .37); return [Math.floor(H2(i, slot) * 192) * 10, Math.floor(H2(i + 7777, slot) * 108) * 10]; };

function sceneField(c, t) {
  fill(c, C.ink);
  const beat = t / BEAT;
  const zoom = 1 + .06 * clamp(t / T.sense) + (t > b(15) ? .10 * eOut3((t - b(15)) / BEAT) : 0);
  c.save(); cam(c, zoom, 0, 0, 0);
  // nền chấm: hiện dần từ giây 0.3
  dotField(c, .075 * eOut3((t - .3) / 1.2), C.text, 4, 40);
  // ── ma trận 3×3 (logo phóng to) ──
  const bob = Math.sin(t * 1.3) * 3;
  if (t < b(11.6)) {
    const lit = matrixLit(beat), fade = 1 - eOut3((t - b(10.8)) / (b(11.6) - b(10.8)));
    for (let i = 0; i < 9; i++) {
      const x = MAT.x0 + (i % 3) * MAT.pitch, y = MAT.y0 + Math.floor(i / 3) * MAT.pitch + bob;
      const on = lit.includes(i);
      // độ sáng theo thời điểm ô bật
      let k = 0; for (const [et, ei] of MAT_EVENTS) if (ei === i && t >= et) k = t - et;
      const pulse = on ? (1 + .5 * Math.exp(-k * 7)) : 1;
      const appear = eOut3((t - .3) / .8);
      c.globalAlpha = fade * appear * (on ? 1 : .55); c.fillStyle = on ? C.lime : C.dim;
      const s = MAT.size * (on ? Math.min(1.25, pulse) : 1); c.fillRect(x + (MAT.size - s) / 2, y + (MAT.size - s) / 2, s, s);
      c.globalAlpha = 1;
      if (on) glow(c, x + 20, y + 20, 150, C.lime, .30 * fade * Math.min(1.4, pulse));
    }
    // vòng vuông lan ra mỗi khi ô bật / đổi thế
    for (const [et, i] of MAT_EVENTS) {
      const u = t - et; if (u < 0 || u > 1.6) continue;
      const x = MAT.x0 + (i % 3) * MAT.pitch + 20, y = MAT.y0 + Math.floor(i / 3) * MAT.pitch + 20 + bob;
      ringSq(c, x, y, 20 + u * 300, 2, C.lime, .26 * (1 - u / 1.6) * fade);
    }
  }
  // ── nhãn gõ chữ (nguồn: hero.domain) ──
  const label = "LOGISTICS · E-COMMERCE";
  if (t > 1.9 && t < b(12)) {
    const n = Math.min(label.length, Math.floor((t - 1.9) / .045));
    const out = t > b(9.5) ? Math.max(0, label.length - Math.floor((t - b(9.5)) / .03)) : label.length;
    const shown = Math.min(n, out);
    const blink = Math.floor(t * 2.5) % 2 === 0 || n < label.length;
    text(c, label.slice(0, shown), 120, 982, font(500, 26, "IBM Plex Mono"), C.sec, "left", 2);
    if (blink && shown > 0 || (shown === 0 && n === label.length ? false : blink)) { c.fillStyle = C.lime; const w = measure(c, label.slice(0, shown), font(500, 26, "IBM Plex Mono"), 2); c.fillRect(120 + w + 6, 962, 14, 26); }
  }
  // ── hạt nhiễu → chữ ──
  if (GL) {
    const rate = lerp(4, 26, clamp((t - 2.6) / 2.6));
    const cx = GL.cx, cy = GL.cy;
    const blast = clamp((t - (T.step[0] - .30)) / .30);
    const gl = t > b(14.4) ? clamp((t - b(14.4)) / (b(16) - b(14.4))) : 0;      // glitch tăng dần
    const popS = 1 + .05 * Math.exp(-Math.max(0, t - T.sense) * 9) * (t >= T.sense ? 1 : 0);
    for (let i = 0; i < GL.N; i++) {
      const p = GL.cells[i]; if (t < p.ap) continue;
      let x, y, col, a = 1, s = 8;
      if (t < p.launch) {
        [x, y] = wanderPos(i, t, rate * p.rate); col = p.big ? C.lime : "#4f6f58"; a = p.big ? .9 : .75;
        if ((i & 7) === 0) col = "#8aa08f";
      } else {
        const u = clamp((t - p.launch) / p.dur); const e = eInOut3(u);
        const [sx0, sy0] = wanderPos(i, p.launch, rate * p.rate);
        const dx = p.tx - sx0, dy = p.ty - sy0, L = Math.hypot(dx, dy) || 1;
        x = lerp(sx0, p.tx, e) + (-dy / L) * p.curve * Math.sin(Math.PI * u) * .5;
        y = lerp(sy0, p.ty, e) + (dx / L) * p.curve * Math.sin(Math.PI * u) * .5;
        if (u < 1) { col = u > .7 ? p.col : "#8fae63"; }
        else {
          col = p.col; const since = t - p.arrive;
          if (since < .10) col = C.hot;
          else if (H2(i, Math.floor(t * 12)) < .012) x += (H2(i, 5) < .5 ? -10 : 10);
          if (popS !== 1) { x = cx + (x - cx) * popS; y = cy + (y - cy) * popS; }
        }
      }
      if (blast > 0) { const k = blast * blast, v = .6 + 1.4 * H2(i, 21); x += (x - cx) * k * v * 2.2; y += (y - cy) * k * v * 2.2; s = 8 + 10 * k; a = 1 - .4 * k; }

/* ─────────────── Bước 01: Hiểu bài toán — ống ngắm khoá vào một ô ─────────────── */
function sceneUnderstand(c, t) {

    for (let i = 0; i < 3; i++) ringSq(c, tx, ty, 30 + k * (900 - i * 220), 3, C.lime, .5 * Math.max(0, 1 - k / (.7 + i * .1)) ); }
  const arm = 56 + (1 - e) * 60; c.strokeStyle = locked ? C.hot : C.lime; c.lineWidth = 6; c.globalAlpha = 1;

/* ─────────────── Bước 02: Chốt định nghĩa — đống thanh lộn xộn khớp vào bảng ─────────────── */

/* ─────────────── Bước 03: Xây và đối chiếu — hai bộ số phải khớp ─────────────── */
function sceneReconcile(c, t) {

/* ─────────────── Điều phối cảnh ─────────────── */
function drawScene(c, t) {
  if (t < b(16)) return sceneField(c, t);
  if (t < T.step[1]) return sceneUnderstand(c, t);
  if (t < T.step[2]) return sceneDefine(c, t);
  if (t < T.step[3]) return sceneReconcile(c, t);
  if (t < T.num) return sceneShip(c, t);
  if (t < T.make) return sceneNumber(c, t);
  if (t < T.cut) return sceneWork(c, t);
  if (t < T.hit) return sceneSilence(c, t);

}

/* ─────────────── Hậu kỳ ─────────────── */

  let lv = 0; while (lv < 4 && (1 << (lv + 1)) <= p) lv++;
  for (let i = 1; i <= lv; i++) { const m = mips[i].getContext("2d"); m.imageSmoothingEnabled = true; m.imageSmoothingQuality = "high"; m.drawImage(i === 1 ? src : mips[i - 1], 0, 0, mips[i].width, mips[i].height); }
  const from = lv === 0 ? src : mips[lv], sw = Math.ceil(W / p), sh = Math.ceil(H / p);
  const m = tmpX; m.imageSmoothingEnabled = true; m.imageSmoothingQuality = "high"; m.clearRect(0, 0, W, H);

function chroma(dst, px) {

  const s = Math.round(px);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

  for (let i = 0; i < 512 * 512; i++) { const v = Math.floor(hash(i + 99) * 255); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  nx.putImageData(im, 0, 0);

  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)"); vx.fillStyle = g; vx.fillRect(0, 0, W, H);
}

/* một mẫu thời gian → cảnh thô (scn) → pixelate → out */
function renderSample(t, out, frameSeed) {
  const st = hitState(t);
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalAlpha = 1; sx.globalCompositeOperation = "source-over";
  sx.save();
  if (st.shake > .3) { // rung + xoay nhẹ, quyết định theo khung (không ngẫu nhiên thật)
    const fi = Math.floor(t * FPS + 1e-6);
    sx.translate((H2(fi, 1) - .5) * 2 * st.shake, (H2(fi, 2) - .5) * 2 * st.shake);
    sx.translate(W / 2, H / 2); sx.rotate((H2(fi, 3) - .5) * .004 * st.shake); sx.translate(-W / 2, -H / 2);
  }

  pixelate(out, scn, st.pix);

function renderFrame(i) {

  // bloom nhẹ cho vùng sáng

  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .13; ctx.filter = "blur(18px)"; ctx.drawImage(bloomC, 0, 0, W, H); ctx.restore();
  // vignette + grain phim
  ctx.drawImage(VIG, 0, 0);

  for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) ctx.drawImage(NOISE, x, y);

window.renderFrame = renderFrame;
