<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; }
  body {
    background:#0A0A0A;
    font-family:'Inter';
  }
  /* vệt sáng lime rất mờ ở góc phải, giữ nền khỏi phẳng lì */
  .glow {
    position:absolute; right:-160px; top:-200px; width:900px; height:900px;
    background:radial-gradient(circle, rgba(212,242,54,.10) 0%, rgba(212,242,54,0) 62%);
  }
  #root { position:relative; width:1600px; background:#0A0A0A;
    background-image:
      linear-gradient(rgba(38,38,31,.55) 2px, transparent 2px),
      linear-gradient(90deg, rgba(38,38,31,.55) 2px, transparent 2px);
    background-size:48px 48px; overflow:hidden; }
  .wrap { position:relative; padding:76px 72px; display:flex; align-items:center; }
  .left { flex:1; }

  .eyebrow {
    font-size:23px; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
    color:#8C8C86; display:flex; align-items:center; gap:18px; margin-bottom:34px;
  }
  .eyebrow .dot { width:9px; height:9px; border-radius:50%; background:#D4F236; }

  h1 {
    font-family:'Archivo'; font-weight:800; text-transform:uppercase;
    letter-spacing:-.035em; line-height:.94; font-size:70px; color:#F2F1EC;
  }
  h1 .lime { color:#D4F236; }

  .sub {
    margin-top:32px; font-size:22px; line-height:1.5; color:#A9A9A2; white-space:nowrap;
  }
  .sep { color:#4a4a44; padding:0 10px; }

  /* ma trận cột — cùng ý tưởng với HeroLattice ở hero site:
     bảng chỉ tiêu hub × ngày, ô đạt ngưỡng thì sáng lime */
  .lattice { display:flex; gap:9px; align-items:flex-end; margin-left:56px; }
  .col { display:flex; flex-direction:column-reverse; gap:9px; }
  .cell { width:34px; height:34px; border-radius:4px; background:#1E1E1C; }
</style>
<div id="root">
<div class="glow"></div>
<div class="wrap">
  <div class="left">
    <div class="eyebrow"><span class="dot"></span>Lương Thế Vinh — BI &amp; Data Analyst</div>
    <h1>Define the metric.<br>Automate the system.<br><span class="lime">Solve the problem.</span></h1>
    <div class="sub">Sáu năm vận hành logistics &amp; thương mại điện tử<span class="sep">·</span>Shopee<span class="sep">·</span>GHN<span class="sep">·</span>J&amp;T Express<span class="sep">·</span>Maersk</div>
  </div>
  <div class="lattice" id="lat"></div>
</div>
</div>
<script>
  const COLS = 11, ROWS = 8;
  const lat = document.getElementById('lat');
  for (let i = 0; i < COLS; i++) {
    const col = document.createElement('div');
    col.className = 'col';
    // sóng chéo dựng lên trái→phải, có nhiễu — một chỉ tiêu đang cải thiện thật,
    // không phải đường thẳng đẹp giả
    const rise = 1.6 + 6.0 * (i / (COLS - 1));
    const jitter = 0.9 * Math.sin(i * 2.1);
    const lit = Math.max(1, Math.min(ROWS, Math.round(rise + jitter)));
    for (let j = 0; j < ROWS; j++) {
      const c = document.createElement('div');
      c.className = 'cell';
      if (j < lit) {
        // ô càng lên cao càng đậm — đọc ra là "vượt ngưỡng"
        const t = lit === 1 ? 1 : j / (lit - 1);
        c.style.background = `rgba(212,242,54,${(0.20 + 0.72 * t).toFixed(3)})`;
      }
      col.appendChild(c);
    }
    lat.appendChild(col);
  }
</script>
